# dsh-fschannel — example bundle patch.
#
# Installed two ways:
#   1. As a profile BUNDLE (add "dsh-fschannel" to the profile package.json's
#      dsh.profile.bundles): this patch is applied automatically.
#   2. By hand into the profile's user layer (~/.dsh/profiles/web/cordis.patch.yml):
#      copy the insert block below there. The user layer survives dsh upgrades.
#
# One row drives BOTH halves: the host half runs the bot transport, the browser
# half (exports["./client"]) renders the Feishu UI. Config keys:
#   envFile        path to a .env holding PATH config (FSCHANNEL_* keys); no
#                  longer used for credentials. Resolved as: FSCHANNEL_ENV_FILE
#                  env var (set by scripts/restart-dsh.ps1 from the .env file)
#                  -> <cwd>/.env
#   appId/appSecret direct credential overrides; otherwise credentials come
#                  from the DSH credential store ($DSH_HOME/.credentials.yaml,
#                  saved via the settings page 飞书机器人 -> 连接凭据)
#   requireMention group chats only respond when @-mentioned (default true;
#                  single-member groups — one user + the bot — skip the @ check)
#   ackInbound     reply "received, processing..." before the answer (default false)
#   reactInbound   react to inbound messages: THUMBSUP on receipt, DONE on
#                  completion, SAD on failure (default true)
#   reactReceived  emoji on receipt (default THUMBSUP)
#   reactDone      emoji when the turn completes (default DONE)
#   reactError     emoji when the turn fails (default SAD)
#   hintUnbound    reply guidance to chats that are not bound (default true)
#   holdImages      stage Feishu images and combine them with the NEXT text
#                  message (vision-tools recognition; default true)
#   holdHint        acknowledge image-only messages (default true)
#   maxHeldImages   staged images per chat (default 10)
#   maxHeldImageBytes  per-image limit (default 10 MiB)
#   holdTtlMs       drop staged images after N ms without text (0 = keep)
#   imageDir        staging directory override (default <session cwd>/.dsh-fschannel-images)
#   output          reply style: 'stream' (streaming cards) or 'plain' (default stream;
#                  adjustable at runtime in the settings page, persisted per machine)
#   showImages      render received images as in-session image nodes (default true;
#                  adjustable at runtime in the settings page)
#   bindingsFile   durable binding store path (default $DSH_HOME/feishu-bindings.json;
#                  override via FSCHANNEL_BINDINGS_FILE in .env)
#   sendImageTool  register the send_feishu_image tool so the agent can send
#                  generated images to the bound chat (default true)
#   sendFileTool   register the send_feishu_file tool so the agent can send
#                  generated files (any type, <= 30 MiB) to the bound chat
#                  (default true)

- insert:
    - id: feishu-bot
      name: 'dsh-fschannel'
      config:
        envFile: !!js process.env.FSCHANNEL_ENV_FILE ?? process.cwd() + '/.env'
        # appId: cli_xxx            # optional direct override
        # appSecret: xxx
        # requireMention: true
        # ackInbound: false
        # reactInbound: true
        # reactReceived: THUMBSUP
        # reactDone: DONE
        # reactError: SAD
        # hintUnbound: true
        # bindingsFile: 'C:/Users/<you>/.dsh/feishu-bindings.json'
